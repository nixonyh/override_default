[package]
name = "override_default"
description = "A `Default` derive where a field can start from something other than its own default."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixonyh/override_default"
readme = "README.md"
exclude = ["/.github/"]
keywords = ["macro", "derive", "default"]
categories = ["no-std", "rust-patterns"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive", "full"] }

[lints.clippy]
redundant_type_annotations = "warn"
